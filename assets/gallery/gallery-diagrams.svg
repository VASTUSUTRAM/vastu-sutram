<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gDiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080D" />
      <stop offset="50%" stop-color="#241017" />
      <stop offset="100%" stop-color="#100C0E" />
    </linearGradient>
    <linearGradient id="gGold6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gDiaBg)" />

  <!-- 9x9 Vastu Purusha Mandala (81 Padas) -->
  <g transform="translate(190, 80)">
    <!-- Outer 9x9 Border -->
    <rect x="0" y="0" width="420" height="420" fill="rgba(30,15,22,0.8)" stroke="url(#gGold6)" stroke-width="3" />

    <!-- 81 Padas Grid (9 divisions each) -->
    <!-- Grid step = 420 / 9 = 46.666 -->
    <!-- Brahmasthan (central 3x3 = 9 padas) -->
    <rect x="140" y="140" width="140" height="140" fill="rgba(198,161,91,0.22)" stroke="#F9E29B" stroke-width="2" />
    <text x="210" y="215" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold" text-anchor="middle">BRAHMA</text>
    <text x="210" y="235" fill="#C6A15B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">9 Padas Central Core</text>

    <!-- Grid Lines -->
    <g stroke="#C6A15B" stroke-opacity="0.3" stroke-width="1">
      <line x1="46.6" y1="0" x2="46.6" y2="420" />
      <line x1="93.3" y1="0" x2="93.3" y2="420" />
      <line x1="140" y1="0" x2="140" y2="420" />
      <line x1="186.6" y1="0" x2="186.6" y2="420" />
      <line x1="233.3" y1="0" x2="233.3" y2="420" />
      <line x1="280" y1="0" x2="280" y2="420" />
      <line x1="326.6" y1="0" x2="326.6" y2="420" />
      <line x1="373.3" y1="0" x2="373.3" y2="420" />

      <line x1="0" y1="46.6" x2="420" y2="46.6" />
      <line x1="0" y1="93.3" x2="420" y2="93.3" />
      <line x1="0" y1="140" x2="420" y2="140" />
      <line x1="0" y1="186.6" x2="420" y2="186.6" />
      <line x1="0" y1="233.3" x2="420" y2="233.3" />
      <line x1="0" y1="280" x2="420" y2="280" />
      <line x1="0" y1="326.6" x2="420" y2="326.6" />
      <line x1="0" y1="373.3" x2="420" y2="373.3" />
    </g>

    <!-- Cardinal Deities on 4 Axes -->
    <text x="210" y="30" fill="#F9E29B" font-family="'Cinzel', serif" font-size="10" font-weight="bold" text-anchor="middle">BHUDHARA / KUBER</text>
    <text x="390" y="215" fill="#F9E29B" font-family="'Cinzel', serif" font-size="10" font-weight="bold" text-anchor="end">SURYA / ARYAMA</text>
    <text x="210" y="405" fill="#F9E29B" font-family="'Cinzel', serif" font-size="10" font-weight="bold" text-anchor="middle">VIVASVAN / YAMA</text>
    <text x="30" y="215" fill="#F9E29B" font-family="'Cinzel', serif" font-size="10" font-weight="bold" text-anchor="start">MITRA / VARUNA</text>
  </g>

  <!-- Title Badge -->
  <rect x="230" y="20" width="340" height="34" rx="17" fill="rgba(18,16,17,0.85)" stroke="url(#gGold6)" stroke-width="1" />
  <text x="400" y="42" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" letter-spacing="2" text-anchor="middle" font-weight="bold">81-PADA PARAMASAYIKA MANDALA</text>
</svg>
