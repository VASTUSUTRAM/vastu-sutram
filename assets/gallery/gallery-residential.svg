<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gResBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B10" />
      <stop offset="50%" stop-color="#281119" />
      <stop offset="100%" stop-color="#121011" />
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
    <radialGradient id="gCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1A0B10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gResBg)" />
  <circle cx="400" cy="300" r="260" fill="url(#gCenterGlow)" />

  <!-- Architectural Grid Blueprint -->
  <g stroke="#C6A15B" stroke-opacity="0.18" stroke-width="1">
    <line x1="100" y1="100" x2="700" y2="100" />
    <line x1="100" y1="200" x2="700" y2="200" />
    <line x1="100" y1="300" x2="700" y2="300" />
    <line x1="100" y1="400" x2="700" y2="400" />
    <line x1="100" y1="500" x2="700" y2="500" />

    <line x1="100" y1="100" x2="100" y2="500" />
    <line x1="250" y1="100" x2="250" y2="500" />
    <line x1="400" y1="100" x2="400" y2="500" />
    <line x1="550" y1="100" x2="550" y2="500" />
    <line x1="700" y1="100" x2="700" y2="500" />
  </g>

  <!-- Luxury Villa Perimeter -->
  <rect x="180" y="140" width="440" height="320" fill="none" stroke="url(#gGold)" stroke-width="2.5" rx="4" />
  
  <!-- Sacred Brahmasthan Central Courtyard -->
  <rect x="340" y="240" width="120" height="120" fill="rgba(198,161,91,0.12)" stroke="url(#gGold)" stroke-width="1.8" stroke-dasharray="4,4" />
  <text x="400" y="305" fill="#F8F3E9" font-family="'Cinzel', Georgia, serif" font-size="11" letter-spacing="3" text-anchor="middle" font-weight="bold">BRAHMASTHAN</text>

  <!-- 16-Zone Radial Energy Rays -->
  <g stroke="#F9E29B" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3,3">
    <line x1="400" y1="300" x2="400" y2="40" />
    <line x1="400" y1="300" x2="660" y2="40" />
    <line x1="400" y1="300" x2="760" y2="300" />
    <line x1="400" y1="300" x2="660" y2="560" />
    <line x1="400" y1="300" x2="400" y2="560" />
    <line x1="400" y1="300" x2="140" y2="560" />
    <line x1="400" y1="300" x2="40" y2="300" />
    <line x1="400" y1="300" x2="140" y2="40" />
  </g>

  <!-- Compass Cardinal Indicators -->
  <text x="400" y="80" fill="#F9E29B" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="middle">NORTH (KUBER)</text>
  <text x="640" y="100" fill="#C6A15B" font-family="'Cinzel', serif" font-size="11" text-anchor="middle">N-E (ISHANYA)</text>
  <text x="730" y="305" fill="#F9E29B" font-family="'Cinzel', serif" font-size="13" font-weight="bold" text-anchor="middle">EAST (INDRA)</text>
  <text x="640" y="520" fill="#C6A15B" font-family="'Cinzel', serif" font-size="11" text-anchor="middle">S-E (AGNI)</text>
  <text x="400" y="540" fill="#F9E29B" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="middle">SOUTH (YAMA)</text>
  <text x="160" y="520" fill="#C6A15B" font-family="'Cinzel', serif" font-size="11" text-anchor="middle">S-W (NAIRITI)</text>
  <text x="80" y="305" fill="#F9E29B" font-family="'Cinzel', serif" font-size="13" font-weight="bold" text-anchor="middle">WEST (VARUNA)</text>
  <text x="160" y="100" fill="#C6A15B" font-family="'Cinzel', serif" font-size="11" text-anchor="middle">N-W (VAYU)</text>

  <!-- Title Badge -->
  <rect x="250" y="20" width="300" height="34" rx="17" fill="rgba(18,16,17,0.85)" stroke="url(#gGold)" stroke-width="1" />
  <text x="400" y="42" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" letter-spacing="2" text-anchor="middle" font-weight="bold">RESIDENTIAL VASTU CAD BLUEPRINT</text>
</svg>
