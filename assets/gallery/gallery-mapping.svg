<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080D" />
      <stop offset="50%" stop-color="#260F17" />
      <stop offset="100%" stop-color="#120E10" />
    </linearGradient>
    <linearGradient id="gGold4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gMapBg)" />

  <!-- Outer Degree Calibration Ring -->
  <circle cx="400" cy="300" r="230" fill="none" stroke="url(#gGold4)" stroke-width="2.5" />
  <circle cx="400" cy="300" r="215" fill="none" stroke="#C6A15B" stroke-width="1" stroke-dasharray="2,4" />
  <circle cx="400" cy="300" r="160" fill="none" stroke="#C6A15B" stroke-width="1.5" />
  <circle cx="400" cy="300" r="80" fill="rgba(198,161,91,0.1)" stroke="url(#gGold4)" stroke-width="1.5" />

  <!-- 16 Radial Direction Segments -->
  <g stroke="#C6A15B" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="400" y1="70" x2="400" y2="530" />
    <line x1="170" y1="300" x2="630" y2="300" />
    <line x1="237" y1="137" x2="563" y2="463" />
    <line x1="237" y1="463" x2="563" y2="137" />
  </g>

  <!-- Central Lotus & Purusha Core -->
  <circle cx="400" cy="300" r="24" fill="#C6A15B" fill-opacity="0.25" stroke="#F9E29B" stroke-width="2" />
  <text x="400" y="304" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="9" font-weight="bold" text-anchor="middle">NABHI</text>

  <!-- Cardinal Sector Labels -->
  <text x="400" y="55" fill="#F9E29B" font-family="'Cinzel', serif" font-size="12" font-weight="bold" text-anchor="middle">NORTH 0°</text>
  <text x="645" y="304" fill="#F9E29B" font-family="'Cinzel', serif" font-size="12" font-weight="bold" text-anchor="start">EAST 90°</text>
  <text x="400" y="555" fill="#F9E29B" font-family="'Cinzel', serif" font-size="12" font-weight="bold" text-anchor="middle">SOUTH 180°</text>
  <text x="155" y="304" fill="#F9E29B" font-family="'Cinzel', serif" font-size="12" font-weight="bold" text-anchor="end">WEST 270°</text>

  <!-- Title Badge -->
  <rect x="230" y="15" width="340" height="34" rx="17" fill="rgba(18,16,17,0.85)" stroke="url(#gGold4)" stroke-width="1" />
  <text x="400" y="37" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" letter-spacing="2" text-anchor="middle" font-weight="bold">16-ZONE SHAKTI CHAKRA MAPPING</text>
</svg>
