<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gComBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D11" />
      <stop offset="60%" stop-color="#221118" />
      <stop offset="100%" stop-color="#0F0C0E" />
    </linearGradient>
    <linearGradient id="gGold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gComBg)" />

  <!-- Office Boundary -->
  <rect x="120" y="100" width="560" height="400" fill="rgba(30,16,22,0.6)" stroke="url(#gGold2)" stroke-width="2" rx="6" />

  <!-- Directorate Cabin in South-West (Nairiti) -->
  <rect x="140" y="360" width="160" height="120" fill="rgba(72,28,37,0.7)" stroke="#C6A15B" stroke-width="1.5" />
  <text x="220" y="415" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold" text-anchor="middle">MD / DIRECTOR CABIN</text>
  <text x="220" y="435" fill="#C6A15B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">South-West Earth Stability</text>

  <!-- Finance & Accounts in North-East (Ishanya) -->
  <rect x="500" y="120" width="160" height="110" fill="rgba(72,28,37,0.7)" stroke="#C6A15B" stroke-width="1.5" />
  <text x="580" y="170" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold" text-anchor="middle">ACCOUNTS & FINANCE</text>
  <text x="580" y="190" fill="#C6A15B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Kuber Inflow Current</text>

  <!-- Server Room in South-East (Agni) -->
  <rect x="500" y="360" width="160" height="120" fill="rgba(72,28,37,0.5)" stroke="#C6A15B" stroke-width="1.5" />
  <text x="580" y="415" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold" text-anchor="middle">SERVER & POWER</text>
  <text x="580" y="435" fill="#C6A15B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Agni Fire Quadrant</text>

  <!-- Central Reception / Atrium -->
  <circle cx="400" cy="300" r="50" fill="rgba(198,161,91,0.15)" stroke="url(#gGold2)" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="400" y="304" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="10" font-weight="bold" text-anchor="middle">BRAHMASTHAN</text>

  <!-- Title Badge -->
  <rect x="250" y="30" width="300" height="34" rx="17" fill="rgba(18,16,17,0.85)" stroke="url(#gGold2)" stroke-width="1" />
  <text x="400" y="52" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" letter-spacing="2" text-anchor="middle" font-weight="bold">COMMERCIAL CORPORATE VASTU</text>
</svg>
