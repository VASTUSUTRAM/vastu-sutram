<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gConBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180C11" />
      <stop offset="60%" stop-color="#281119" />
      <stop offset="100%" stop-color="#120D10" />
    </linearGradient>
    <linearGradient id="gGold5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gConBg)" />

  <!-- Sacred Geometry Geometric Star & Aura -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="url(#gGold5)" stroke-width="1.5" stroke-dasharray="4,6" />
  
  <!-- Non-Demolition Remedial Instruments: Brass Helix, Pyramidal Energy Grids -->
  <g transform="translate(400, 300)" stroke="url(#gGold5)" stroke-width="2" fill="none">
    <!-- Star of David / Shatkona Elemental Interlock -->
    <polygon points="0,-160 138.5,80 -138.5,80" stroke="#F9E29B" stroke-width="2.5" fill="rgba(198,161,91,0.06)" />
    <polygon points="0,160 138.5,-80 -138.5,-80" stroke="#F9E29B" stroke-width="2.5" fill="rgba(198,161,91,0.06)" />
    
    <!-- Inner Concentric Circles -->
    <circle cx="0" cy="0" r="90" stroke="#C6A15B" stroke-width="1.8" />
    <circle cx="0" cy="0" r="45" stroke="#F9E29B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="10" fill="#F9E29B" />
  </g>

  <!-- 4 Pillars of Vedic Space Planning -->
  <text x="210" y="160" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold">1. COSMIC SOLAR ORIENTATION</text>
  <text x="490" y="160" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold">2. GEOMAGNETIC HARMONY</text>
  <text x="210" y="470" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold">3. 5-ELEMENTAL EQUILIBRIUM</text>
  <text x="490" y="470" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" font-weight="bold">4. ZERO DEMOLITION PROTOCOL</text>

  <!-- Title Badge -->
  <rect x="230" y="25" width="340" height="34" rx="17" fill="rgba(18,16,17,0.85)" stroke="url(#gGold5)" stroke-width="1" />
  <text x="400" y="47" fill="#F8F3E9" font-family="'Cinzel', serif" font-size="11" letter-spacing="2" text-anchor="middle" font-weight="bold">VEDIC SPATIAL CONSULTATION AUDIT</text>
</svg>
