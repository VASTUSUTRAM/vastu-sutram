<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <linearGradient id="pGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="30%" stop-color="#D9A52D" />
      <stop offset="70%" stop-color="#B8861B" />
      <stop offset="100%" stop-color="#D9B878" />
    </linearGradient>

    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3D56" />
      <stop offset="50%" stop-color="#092D40" />
      <stop offset="100%" stop-color="#041620" />
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D9A52D" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#A72F32" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#092D40" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sareeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A72F32" />
      <stop offset="50%" stop-color="#801C20" />
      <stop offset="100%" stop-color="#550D10" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0D0B6" />
      <stop offset="100%" stop-color="#DFB898" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- BACKGROUND & AURA -->
  <rect width="600" height="720" rx="24" fill="url(#pBgGrad)" />
  <circle cx="300" cy="280" r="240" fill="url(#auraGlow)" />

  <!-- SACRED GEOMETRY BACKGROUND PATTERN (Subtle) -->
  <g opacity="0.12" stroke="url(#pGoldGrad)" stroke-width="1.2" fill="none">
    <circle cx="300" cy="280" r="200" />
    <circle cx="300" cy="280" r="160" stroke-dasharray="4,4" />
    <circle cx="300" cy="280" r="120" />
    <polygon points="300,100 455,370 145,370" />
    <polygon points="300,460 455,190 145,190" />
  </g>

  <!-- PORTRAIT ILLUSTRATION / ARTISTIC DEPICTION -->
  <g id="portraitSubject">
    <!-- Back Hair Flow -->
    <path d="M 210 240 C 190 280 185 360 205 450 C 230 460 370 460 395 450 C 415 360 410 280 390 240 Z" fill="#1A1513" />

    <!-- Shoulders & Traditional Luxury Saree / Attire -->
    <path d="M 160 520 C 180 430 220 405 250 400 L 350 400 C 380 405 420 430 440 520 L 460 700 L 140 700 Z" fill="url(#sareeGrad)" filter="url(#softShadow)" />
    
    <!-- Gold Embroidered Saree Zari Border -->
    <path d="M 250 400 C 275 480 310 590 340 700 L 375 700 C 345 580 310 470 290 400 Z" fill="url(#pGoldGrad)" />
    <path d="M 290 400 C 310 470 345 580 375 700" stroke="#73191C" stroke-width="2" stroke-dasharray="3,3" fill="none" />

    <!-- Neck & Face -->
    <path d="M 270 340 L 270 415 C 285 425 315 425 330 415 L 330 340 Z" fill="url(#skinGrad)" />
    <!-- Graceful Jawline and Face Oval -->
    <ellipse cx="300" cy="275" rx="68" ry="85" fill="url(#skinGrad)" />

    <!-- Styled Dark Hair & Braid -->
    <path d="M 232 260 C 230 190 260 160 300 160 C 340 160 370 190 368 260 C 350 205 325 190 300 190 C 275 190 250 205 232 260 Z" fill="#1C1514" />
    <path d="M 232 260 C 235 220 265 195 300 195 C 335 195 365 220 368 260 C 362 230 335 205 300 205 C 265 205 238 230 232 260 Z" fill="#2E201B" />

    <!-- Subtle Facial Features & Poise -->
    <!-- Eyes -->
    <path d="M 265 260 Q 278 253 290 260 Q 278 264 265 260 Z" fill="#2A1B14" />
    <circle cx="278" cy="258" r="2.5" fill="#4A2F20" />
    <circle cx="279" cy="257" r="0.8" fill="#FFF" />
    <path d="M 263 252 Q 277 248 291 254" stroke="#231710" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <path d="M 310 260 Q 322 253 335 260 Q 322 264 310 260 Z" fill="#2A1B14" />
    <circle cx="322" cy="258" r="2.5" fill="#4A2F20" />
    <circle cx="323" cy="257" r="0.8" fill="#FFF" />
    <path d="M 309 254 Q 323 248 337 252" stroke="#231710" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Traditional Bindi -->
    <circle cx="300" cy="242" r="3.2" fill="#A72F32" />

    <!-- Nose Bridge & Contour -->
    <path d="M 299 255 L 297 282 Q 300 286 303 282" stroke="#C89D7B" stroke-width="1.6" fill="none" stroke-linecap="round" />

    <!-- Gentle Confident Smile -->
    <path d="M 287 308 Q 300 317 313 308" stroke="#A72F32" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 292 312 Q 300 316 308 312" stroke="#8E2427" stroke-width="1.5" fill="none" />

    <!-- Elegant Gold Earrings (Jhumkas) -->
    <circle cx="230" cy="285" r="5" fill="url(#pGoldGrad)" />
    <polygon points="225,290 235,290 230,305" fill="url(#pGoldGrad)" />
    <circle cx="370" cy="285" r="5" fill="url(#pGoldGrad)" />
    <polygon points="365,290 375,290 370,305" fill="url(#pGoldGrad)" />
  </g>

  <!-- LUXURY ARCHITECTURAL GOLDEN BORDER FRAME -->
  <rect x="20" y="20" width="560" height="680" rx="18" fill="none" stroke="url(#pGoldGrad)" stroke-width="2.5" />
  <rect x="28" y="28" width="544" height="664" rx="12" fill="none" stroke="url(#pGoldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Ornate Corner Motifs -->
  <g fill="url(#pGoldGrad)">
    <!-- Top-Left -->
    <polygon points="20,45 45,20 20,20" />
    <circle cx="48" cy="48" r="3" />
    <!-- Top-Right -->
    <polygon points="580,45 555,20 580,20" />
    <circle cx="552" cy="48" r="3" />
    <!-- Bottom-Left -->
    <polygon points="20,675 45,700 20,700" />
    <circle cx="48" cy="672" r="3" />
    <!-- Bottom-Right -->
    <polygon points="580,675 555,700 580,700" />
    <circle cx="552" cy="672" r="3" />
  </g>

  <!-- OFFICIAL CONSULTANT LOWER BADGE OVERLAY -->
  <g transform="translate(60, 595)">
    <rect width="480" height="85" rx="14" fill="#092D40" fill-opacity="0.95" stroke="url(#pGoldGrad)" stroke-width="1.8" filter="url(#softShadow)" />
    
    <!-- Verified Golden Seal -->
    <g transform="translate(42, 42)">
      <circle cx="0" cy="0" r="22" fill="#A72F32" stroke="url(#pGoldGrad)" stroke-width="1.8" />
      <path d="M -8 0 L -2 6 L 9 -5" stroke="url(#pGoldGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <text x="80" y="36" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="url(#pGoldGrad)">
      RAJNI SINGH
    </text>
    <text x="82" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#F5EEDF">
      VASTU CONSULTANT
    </text>
    <text x="82" y="74" font-family="'Inter', sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#D9B878">
      Traditional Shastra • Architectural Energy Alignment
    </text>
  </g>
</svg>