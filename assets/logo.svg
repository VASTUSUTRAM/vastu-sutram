<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29B" />
      <stop offset="35%" stop-color="#D9A52D" />
      <stop offset="70%" stop-color="#B8861B" />
      <stop offset="100%" stop-color="#D9B878" />
    </linearGradient>

    <!-- Maroon Linear Gradient -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23B3E" />
      <stop offset="50%" stop-color="#A72F32" />
      <stop offset="100%" stop-color="#73191C" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Sun + Lotus + House-Roof Symbol) -->
  <g transform="translate(20, 10)">
    <!-- Decorative Outer Halo Ring -->
    <circle cx="70" cy="70" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <circle cx="70" cy="70" r="58" fill="#092D40" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Traditional House Roof / Architectural Gopura Apex -->
    <path d="M 70 20 L 115 56 L 105 58 L 70 30 L 35 58 L 25 56 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="70,16 74,23 66,23" fill="url(#goldGrad)" />

    <!-- Radiant Sun with Solar Rays -->
    <g transform="translate(70, 60)">
      <!-- Sun Core -->
      <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="11" fill="url(#maroonGrad)" />
      <circle cx="0" cy="0" r="5" fill="url(#goldGrad)" />

      <!-- Solar Rays (12 radiating directions) -->
      <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-26" x2="0" y2="-19" />
        <line x1="18.3" y1="-18.3" x2="13.4" y2="-13.4" />
        <line x1="26" y1="0" x2="19" y2="0" />
        <line x1="18.3" y1="18.3" x2="13.4" y2="13.4" />
        <line x1="0" y1="26" x2="0" y2="19" />
        <line x1="-18.3" y1="18.3" x2="-13.4" y2="13.4" />
        <line x1="-26" y1="0" x2="-19" y2="0" />
        <line x1="-18.3" y1="-18.3" x2="-13.4" y2="-13.4" />
      </g>
    </g>

    <!-- Sacred Blooming Lotus at Base -->
    <g transform="translate(70, 95)">
      <!-- Central Lotus Petal -->
      <path d="M 0 -18 C -7 -10 -9 -2 0 10 C 9 -2 7 -10 0 -18 Z" fill="url(#goldGrad)" stroke="#A72F32" stroke-width="1" />
      
      <!-- Side Lotus Petals (Left & Right) -->
      <path d="M -2 -14 C -16 -12 -22 -2 -12 8 C -6 6 -3 2 -2 -14 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1" />
      <path d="M 2 -14 C 16 -12 22 -2 12 8 C 6 6 3 2 2 -14 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1" />

      <!-- Outer Flared Lotus Petals -->
      <path d="M -12 6 C -28 3 -34 14 -18 17 C -10 16 -8 11 -12 6 Z" fill="url(#goldGrad)" opacity="0.95" />
      <path d="M 12 6 C 28 3 34 14 18 17 C 10 16 8 11 12 6 Z" fill="url(#goldGrad)" opacity="0.95" />

      <!-- Lotus Pedestal Base / Water line -->
      <path d="M -28 17 C -15 21 15 21 28 17 C 22 23 -22 23 -28 17 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1" />
    </g>
  </g>

  <!-- BRAND NAME & TYPOGRAPHY -->
  <g transform="translate(170, 30)">
    <!-- Main Brand Name -->
    <text x="0" y="52" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">
      VASTU SUTRAM
    </text>
    
    <!-- Decorative Divider Line with Diamond Center -->
    <line x1="0" y1="68" x2="185" y2="68" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
    <polygon points="195,68 199,64 203,68 199,72" fill="#A72F32" stroke="url(#goldGrad)" stroke-width="1" />
    <line x1="213" y1="68" x2="398" y2="68" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

    <!-- Tagline -->
    <text x="3" y="94" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="14.5" font-weight="600" letter-spacing="6.5" fill="#A72F32">
      THE PRINCIPLES OF VASTU
    </text>

    <!-- Consultant Byline -->
    <text x="4" y="118" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="400" letter-spacing="2" fill="#D9B878">
      RAJNI SINGH • VASTU CONSULTANT
    </text>
  </g>
</svg>